services:

  # ── Banco de dados ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: controle-acesso-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-controle_acesso}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-JGustavo2106}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-controle_acesso}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acesso-net

  # ── Backend (FastAPI + Uvicorn + WebSockets) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: controle-acesso-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-JGustavo2106}@db:5432/${POSTGRES_DB:-controle_acesso}
      JWT_SECRET: ${JWT_SECRET:-4f697b0a8c2d5e3f1a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ARDLOCK_DOMAIN: ${ARDLOCK_DOMAIN:-ardlock.jangustavo.me}
      PYTHONPATH: /app
    volumes:
      - ./backend/app:/app/app   # Hot-reload ao vivo em ambiente de dev
      - ./backend/tests:/app/tests:ro

    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acesso-net

  # ── Frontend (Angular estático em Nginx, interno ao gateway TLS) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controle-acesso-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - acesso-net

  # ── Gateway HTTPS/WSS (Caddy + ACME automático) ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: controle-acesso-caddy
    restart: unless-stopped
    environment:
      ARDLOCK_DOMAIN: ${ARDLOCK_DOMAIN:-ardlock.jangustavo.me}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - acesso-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  acesso-net:
    driver: bridge