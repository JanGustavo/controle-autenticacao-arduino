services:

  # ── Banco de dados ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: controle-acesso-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ardlock}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ardlock}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Uvicorn) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: controle-acesso-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-ardlock}
    volumes:
      - ./backend/app:/app/app   # hot reload: sincroniza código ao vivo
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Angular → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controle-acesso-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
