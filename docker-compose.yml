services:

  # ── Banco de dados ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: controle-acesso-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-controle_acesso}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-JGustavo2106}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-controle_acesso}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Uvicorn + WebSockets) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: controle-acesso-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-JGustavo2106}@db:5432/${POSTGRES_DB:-controle_acesso}
    volumes:
      - ./backend/app:/app/app   # Hot-reload ao vivo em ambiente de dev
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Angular Totem → Nginx com Reverse Proxy p/ WebSocket) ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controle-acesso-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
