<app-auth-frame
  titulo="Recuperar acesso ao painel"
  texto="A senha nova é criada por um link enviado ao seu e-mail."
  rotuloTrilha="Etapas para recuperar a senha"
  [etapas]="etapas"
>
  <a routerLink="/login" class="ard-back"><mat-icon aria-hidden="true">arrow_back</mat-icon>Voltar para o login</a>
  <h1>Recuperar senha</h1>
  <p class="auth-sub">Informe seu e-mail para receber as instruções.</p>

  <form (ngSubmit)="onSubmit()" class="ard-form auth-campos" novalidate>
    @if (erro()) {
      <p class="ard-notice is-error" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon><span>{{ erro() }}</span>
      </p>
    }
    @if (sucesso()) {
      <p class="ard-notice is-success" role="status">
        <mat-icon aria-hidden="true">mark_email_read</mat-icon><span>{{ sucesso() }}</span>
      </p>
    }

    <div class="ard-field">
      <label for="recuperar-email">E-mail</label>
      <input id="recuperar-email" type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
    </div>

    <button type="submit" class="ard-btn is-primary auth-enviar" [disabled]="carregando()" [attr.aria-busy]="carregando()">
      @if (carregando()) {
        <span class="ard-spinner" aria-hidden="true"></span>
        Enviando
      } @else {
        <mat-icon aria-hidden="true">send</mat-icon>
        {{ sucesso() ? 'Enviar de novo' : 'Enviar instruções' }}
      }
    </button>
  </form>
</app-auth-frame>
