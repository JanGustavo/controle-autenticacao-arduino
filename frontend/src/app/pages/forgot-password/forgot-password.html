<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <div class="header-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <mat-card-title>Recuperar Senha</mat-card-title>
      <mat-card-subtitle>Informe seu e-mail para receber as instruções</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        @if (erro()) {
          <div class="error-banner">
            <mat-icon>error_outline</mat-icon>
            <span>{{ erro() }}</span>
          </div>
        }

        @if (sucesso()) {
          <div class="success-banner">
            <mat-icon>check_circle_outline</mat-icon>
            <span>{{ sucesso() }}</span>
          </div>
        }

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
            autocomplete="email"
          />
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-btn"
          [disabled]="carregando()"
        >
          @if (carregando()) {
            <mat-spinner diameter="24" class="btn-spinner"></mat-spinner>
          } @else {
            <ng-container>
              <span>Enviar instruções</span>
              <mat-icon>send</mat-icon>
            </ng-container>
          }
        </button>
      </form>
      <div class="back-to-login">
        <a routerLink="/login" mat-button color="primary">Voltar para o Login</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
