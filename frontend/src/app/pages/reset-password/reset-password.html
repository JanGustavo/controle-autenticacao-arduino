<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <div class="header-icon">
        <mat-icon>vpn_key</mat-icon>
      </div>
      <mat-card-title>Redefinir Senha</mat-card-title>
      <mat-card-subtitle>Digite sua nova senha de acesso</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        @if (erro()) {
          <div class="error-banner">
            <mat-icon>error_outline</mat-icon>
            <span>{{ erro() }}</span>
          </div>
        }

        @if (sucesso()) {
          <div class="success-banner">
            <mat-icon>check_circle_outline</mat-icon>
            <span>{{ sucesso() }}</span>
          </div>
        }

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nova Senha</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            [(ngModel)]="nova_senha"
            name="nova_senha"
            placeholder="Digite a nova senha"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="togglePassword($event)"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar Senha</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            [(ngModel)]="confirmar_senha"
            name="confirmar_senha"
            placeholder="Confirme a nova senha"
            required
            autocomplete="new-password"
          />
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-btn"
          [disabled]="carregando() || !token"
        >
          @if (carregando()) {
            <mat-spinner diameter="24" class="btn-spinner"></mat-spinner>
          } @else {
            <ng-container>
              <span>Salvar Nova Senha</span>
              <mat-icon>save</mat-icon>
            </ng-container>
          }
        </button>
      </form>
      <div class="back-to-login">
        <a routerLink="/login" mat-button color="primary">Voltar para o Login</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
