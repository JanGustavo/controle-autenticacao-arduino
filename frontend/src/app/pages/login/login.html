<app-auth-frame
  titulo="Cada acesso passa por quatro verificações"
  texto="No painel você define quem entra, onde e quando, e acompanha cada decisão."
  rotuloTrilha="Como o ArdLock decide um acesso"
  [etapas]="etapas"
>
  <a routerLink="/" class="ard-back"><mat-icon aria-hidden="true">arrow_back</mat-icon>Voltar para o início</a>
  <h1>Acesso do gestor</h1>
  <p class="auth-sub">Digite suas credenciais para acessar o painel.</p>

  <form (ngSubmit)="onSubmit()" class="ard-form auth-campos" novalidate>
    @if (erro()) {
      <p class="ard-notice is-error" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon><span>{{ erro() }}</span>
      </p>
    }

    <div class="ard-field">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" [(ngModel)]="usuario" name="usuario" required autocomplete="username" />
    </div>

    <div class="ard-field">
      <div class="rotulo-linha">
        <label for="login-senha">Senha</label>
        <a routerLink="/forgot-password" class="ard-link">Esqueceu a senha?</a>
      </div>
      <div class="ard-input-wrap">
        <input
          id="login-senha"
          [type]="hidePassword() ? 'password' : 'text'"
          [(ngModel)]="senha"
          name="senha"
          required
          autocomplete="current-password"
        />
        <button
          type="button"
          class="ard-icon-btn"
          (click)="togglePassword($event)"
          aria-label="Mostrar senha"
          [attr.aria-pressed]="!hidePassword()"
        >
          <mat-icon aria-hidden="true">{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </div>
    </div>

    <button type="submit" class="ard-btn is-primary auth-enviar login-btn" [disabled]="carregando()" [attr.aria-busy]="carregando()">
      @if (carregando()) {
        <span class="ard-spinner" aria-hidden="true"></span>
        Entrando
      } @else {
        <mat-icon aria-hidden="true">login</mat-icon>
        Entrar
      }
    </button>
  </form>

  <p class="login-adquirir">
    Ainda não tem uma licença?
    <a routerLink="/checkout" class="ard-link login-adquirir-link">
      <mat-icon aria-hidden="true">storefront</mat-icon>
      Adquirir licença
    </a>
  </p>
</app-auth-frame>
