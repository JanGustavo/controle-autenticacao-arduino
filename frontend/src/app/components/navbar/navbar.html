<header class="app-header">
  <div class="header-container">
    <!-- NOME DO APP / BRAND -->
    <a routerLink="/adm-page" class="brand">
      <div class="brand-icon">
        <img src="ard-lock-icon.svg" alt="ArdLock Icon" class="brand-logo-img" />
      </div>
      <div class="brand-text">
        <h1>ArdLock</h1>
        <span class="brand-tag">Controle de Acesso</span>
      </div>
    </a>

    <!-- ACOES HEADER (DARK MODE & LOGOFF) -->
    <div class="header-actions">
      <button
        mat-icon-button
        class="action-btn theme-btn"
        (click)="toggleDarkMode()"
        [matTooltip]="darkMode() ? 'Modo Claro' : 'Modo Escuro'"
      >
        <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      @if (isLoggedIn()) {
        <div class="user-profile">
          <div
            class="user-avatar"
            [class.clickable]="userDisplay.foto_url && isImgValid(userDisplay.foto_url)"
            (click)="expandirFoto(userDisplay.foto_url)"
            [matTooltip]="userDisplay.foto_url && isImgValid(userDisplay.foto_url) ? 'Clique para expandir a foto' : ''"
          >
            @if (userDisplay.foto_url && isImgValid(userDisplay.foto_url)) {
              <img
                [src]="userDisplay.foto_url"
                [alt]="userDisplay.name"
                class="avatar-img"
                (error)="onImgError(userDisplay.foto_url)"
              />
            } @else {
              <span class="avatar-initial">{{ avatarInitial }}</span>
            }
          </div>
          <div class="user-info">

            <span class="user-name">{{ userDisplay.name }}</span>
            <span class="user-meta">
              <span class="status-dot"></span>
              Logado
            </span>
          </div>
        </div>


        <button
          mat-icon-button
          color="warn"
          class="action-btn logoff-btn"
          (click)="logoff()"
          matTooltip="Sair / Logoff"
        >
          <mat-icon>logout</mat-icon>
        </button>
      }
    </div>
  </div>
</header>

<!-- MODAL DE EXPANSÃO DA FOTO -->
@if (fotoModalUrl()) {
  <div class="photo-modal-backdrop" (click)="fecharFotoModal()">
    <div class="photo-modal-card" (click)="$event.stopPropagation()">
      <button class="modal-close-btn" (click)="fecharFotoModal()" title="Fechar (Esc)">
        <mat-icon>close</mat-icon>
      </button>
      <div class="modal-image-wrapper">
        <img [src]="fotoModalUrl()!" [alt]="userDisplay.name" />
      </div>
      @if (userDisplay.name) {
        <div class="modal-caption">{{ userDisplay.name }}</div>
      }
    </div>
  </div>
}
